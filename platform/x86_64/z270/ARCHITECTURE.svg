<use xlink:href="#ram" transform="translate(998 261)" color="#218778"/>
<text x="1037" y="270" font-size="18" font-weight="600">约 31.2 GiB 可用 RAM</text><text x="1037" y="289" class="sm">保留 hvisor 与固件占用</text>
<path d="M104 324H1264" stroke="#c9e2d8"/>
<text x="107" y="360" class="body">原生驱动</text><path d="M203 354H235" class="flow"/>
<text x="252" y="360" class="body">systemd</text><path d="M344 354H376" class="flow"/>
<text x="393" y="360" class="body">Plasma Login / KDE Wayland</text>
<text x="107" y="390" class="sm">统一使用设备 · 保留桌面、存储与远程管理链路</text>
<text x="904" y="369" font-size="18" font-weight="600" fill="#218778">实测：19 项 PCI 功能归属 Zone0</text>
