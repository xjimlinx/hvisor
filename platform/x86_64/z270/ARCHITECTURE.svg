<text x="178" y="292" class="body">可信管理域 · Arch Linux 6.18 LTS</text>
<rect x="716" y="246" width="246" height="57" rx="12" fill="#fff" stroke="#d5e8e1"/>
<use xlink:href="#cpu" transform="translate(733 261)" color="#218778"/>
<text x="772" y="270" font-size="18" font-weight="600">CPU 0–7</text><text x="772" y="289" class="sm">4 核 / 8 线程</text>
