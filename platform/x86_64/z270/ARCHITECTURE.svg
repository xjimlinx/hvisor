<text x="1690" y="516" class="eyebrow mutewhite" text-anchor="end">02 / CONTROL PLANE</text>
<text x="106" y="576" class="h white" font-size="21">设备发现 → 归属</text>
<text x="106" y="610" class="body mutewhite" >枚举物理拓扑 → 具名清单</text>
<text x="106" y="637" class="sm mutewhite" >ROOT_PCI_DEVS → guest_pci_init</text>
