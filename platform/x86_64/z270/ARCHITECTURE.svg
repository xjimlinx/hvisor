<text x="145" y="68" class="eyebrow">BARE-METAL / RESOURCE OWNERSHIP</text>
<text x="145" y="112" font-size="40" font-weight="700">Z270 · 一台实机，一个管理域</text>
<text x="80" y="151" class="body" fill="#637b8d">ASUS PRIME Z270-AR  /  i7-7700K  /  32 GiB  /  GTX 1080 Ti</text>
<rect x="1248" y="58" width="472" height="64" rx="12" fill="#fff4df" stroke="#edd8ad"/>
<circle cx="1271" cy="80" r="4" fill="#b98020"/>
<text x="1286" y="86" font-size="16" fill="#966821" font-weight="600">原生拓扑 · 实机已启动</text>
<text x="1270" y="109" class="sm">19 PCI 功能 · 8 线程 · 桌面与双网络正常</text>
<text x="80" y="197" class="eyebrow">01 / GUEST OWNERSHIP</text>
<!-- Zone0 owns the usable resources, not the hypervisor control layer. -->
<rect x="80" y="218" width="1208" height="196" rx="20" fill="url(#mint)" stroke="#b6dcd0" filter="url(#shadow)"/>
<rect x="104" y="242" width="54" height="54" rx="14" fill="#d4eee4"/>
