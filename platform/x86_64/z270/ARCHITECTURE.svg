<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1800" height="1340" viewBox="0 0 1800 1340" role="img" aria-labelledby="title desc">
<title id="title">Z270 · hvisor 裸机资源架构</title>
<desc id="desc">分层展示 Zone0、hvisor 的控制路径、19 个物理 PCI 功能与上游桥。19 功能全拓扑已实机启动验证；LPC/PMC平台功能未验收。右上虚线 Zone 仅为未来规划。</desc>
