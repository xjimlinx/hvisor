<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1420" viewBox="0 0 1400 1420" role="img" aria-labelledby="title desc">
<title id="title">Z270 裸机 hvisor：硬件、分配与 Zone0 架构</title>
<desc id="desc">实机已验证十一项 PCI 功能。十九项原生拓扑为本地待部署配置。所有可分配资源归可信 Zone0，虚拟机监控器保留必要控制资源。底部表示未来分区设计而非已实现能力。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#537198"/></marker></defs>
<style>
text{font-family:"Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif;fill:#172b4d}
.title{font-size:30px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#47617e}.tag{font-size:16px;font-weight:700;fill:#986100}
.box{fill:white;stroke:#cbd8e8;stroke-width:1.5}.flow{fill:none;stroke:#537198;stroke-width:2;marker-end:url(#arrow)}
</style><rect width="1400" height="1420" fill="#f3f6fb"/>
<text x="40" y="52" class="title">Z270 · 裸机 hvisor / Zone0 资源架构</text>
<text x="40" y="84" class="small">2026-09-13 · ASUS PRIME Z270-AR · i7-7700K（4 核 / 8 线程）· 32 GiB · GTX 1080 Ti</text>
<rect x="40" y="103" width="1320" height="64" rx="12" fill="#fff3d8"/>
<text x="60" y="130" class="tag">状态边界：运行基线 = 11 PCI 功能已接入；19 功能原生拓扑 = 本地候选，尚未实机验证</text>
<text x="60" y="153" class="small">“全部归 Zone0”不等于无条件直通所有寄存器；IOMMU 组号来自原生 Arch，不代表跨 Zone 隔离已验证。</text>
<text x="40" y="207" class="head">① 真实硬件拓扑 / 分配依赖（以下均为物理 BDF；G = 原生 IOMMU 组）</text><rect x="40" y="225" width="425" height="190" rx="12" fill="#ffffff" stroke="#cbd8e8"/><text x="58" y="255" class="head">显示分配单元 · G1</text><text x="58" y="285" class="body">00:01.0 PEG 桥 → bus 01</text><text x="58" y="310" class="body">01:00.0 GPU + 01:00.1 HDMI</text><text x="58" y="335" class="body">共享上游 / 电源 / 复位依赖</text><text x="58" y="360" class="body">现有：NVIDIA 580 / Wayland 已验证</text><text x="58" y="385" class="body">未来：GPU 与音频共同评估迁移</text><rect x="485" y="225" width="425" height="190" rx="12" fill="#ffffff" stroke="#cbd8e8"/><text x="503" y="255" class="head">外置 PCIe 分支</text><text x="503" y="285" class="body">00:1c.4 RP5 [G7] → 04:00.0</text><text x="503" y="310" class="body">ASMedia xHCI [G12] → 全部 USB 端口</text><text x="503" y="335" class="body">00:1c.7 RP8 [G8] → 05:00.0</text><text x="503" y="360" class="body">AX210 Wi-Fi [G13]；蓝牙走 USB</text><text x="503" y="385" class="body">桥与端点不同组 ≠ 复位影响无关</text><rect x="930" y="225" width="430" height="190" rx="12" fill="#fff9ed" stroke="#cbd8e8"/><text x="948" y="255" class="head">平台管理单元 · G10</text><text x="948" y="285" class="body">00:1f.0 LPC / 00:1f.2 PMC</text><text x="948" y="310" class="body">00:1f.3 PCH 音频 / 00:1f.4 SMBus</text><text x="948" y="335" class="body">共享平台、电源、legacy I/O 依赖</text><text x="948" y="360" class="body">音频 / SMBus 已接入</text><text x="948" y="385" class="body">LPC / PMC：本地新增，待验证</text><rect x="40" y="435" width="425" height="170" rx="12" fill="#ffffff" stroke="#cbd8e8"/><text x="58" y="465" class="head">启动与输入</text><text x="58" y="495" class="body">00:17.0 AHCI [G4] → SSD + 数据盘</text><text x="58" y="520" class="body">根盘与数据盘不能按 PCI 单独拆开</text><text x="58" y="545" class="body">00:14.0 PCH xHCI [G2]</text><text x="58" y="570" class="body">→ 键鼠 / USB 外设 / 蓝牙连接</text><text x="58" y="595" class="body">AHCI、键鼠已验证</text><rect x="485" y="435" width="425" height="170" rx="12" fill="#ffffff" stroke="#cbd8e8"/><text x="503" y="465" class="head">网络与管理</text><text x="503" y="495" class="body">00:1f.6 I219-V [G11] → PPPoE</text><text x="503" y="520" class="body">管理 SSH 链路；迁移前需替代链路</text><text x="503" y="545" class="body">00:16.0 MEI [G3] → Intel ME</text><text x="503" y="570" class="body">Wi-Fi / 以太网 / MEI 驱动已验证</text><text x="503" y="595" class="body">MEI 管理命令和固件操作未测试</text><rect x="930" y="435" width="430" height="170" rx="12" fill="#fff9ed" stroke="#cbd8e8"/><text x="948" y="465" class="head">根桥与空分支</text><text x="948" y="495" class="body">00:00.0 Host bridge [G0]</text><text x="948" y="520" class="body">00:1b.0 RP17 [G5] → bus 02（空）</text><text x="948" y="545" class="body">00:1c.0 RP1 [G6] → bus 03（空）</text><text x="948" y="570" class="body">00:1d.0 RP9 [G9] → bus 06（空）</text><text x="948" y="595" class="body">六个 PCIe 桥：候选中恢复客体可见</text><path d="M700 605V640" class="flow"/><text x="720" y="630" class="small">硬件枚举 + 审核后的板级清单</text>
<rect x="40" y="653" width="1320" height="263" rx="16" fill="#e7eefb" stroke="#a4bade"/>
<text x="60" y="688" class="head">② hvisor 控制层（始终保留）</text><rect x="60" y="705" width="305" height="187" rx="12" fill="#ffffff" stroke="#cbd8e8"/><text x="78" y="735" class="head">发现与归属</text><text x="78" y="765" class="body">hvisor_pci_init</text><text x="78" y="790" class="body">GLOBAL_PCIE_LIST</text><text x="78" y="815" class="body">具名 inventory → ROOT_PCI_DEVS</text><text x="78" y="840" class="body">guest_pci_init 绑定可见设备</text><text x="78" y="865" class="body">候选：原 BDF → 同 BDF</text><rect x="385" y="705" width="305" height="187" rx="12" fill="#ffffff" stroke="#cbd8e8"/><text x="403" y="735" class="head">CPU / 内存</text><text x="403" y="765" class="body">VT-x / VMCS / VM-exit</text><text x="403" y="790" class="body">8 线程配置给 Zone0</text><text x="403" y="815" class="body">EPT：RAM + 显式 BAR 映射</text><text x="403" y="840" class="body">hvisor 自用内存不交给客体</text><text x="403" y="865" class="body">BAR 自动分配尚未实现</text><rect x="710" y="705" width="305" height="187" rx="12" fill="#ffffff" stroke="#cbd8e8"/><text x="728" y="735" class="head">DMA / 中断</text><text x="728" y="765" class="body">VT-d context 使用物理 BDF</text><text x="728" y="790" class="body">设备交接：停止旧 DMA</text><text x="728" y="815" class="body">APIC / IOAPIC / MSI 路径</text><text x="728" y="840" class="body">不是直接暴露整页 APIC</text><text x="728" y="865" class="body">跨 Zone IRQ 隔离仍需审计</text><rect x="1035" y="705" width="305" height="187" rx="12" fill="#ffffff" stroke="#cbd8e8"/><text x="1053" y="735" class="head">客体硬件视图</text><text x="1053" y="765" class="body">vPCI：配置空间访问处理</text><text x="1053" y="790" class="body">ACPI：MCFG / DSDT / MADT</text><text x="1053" y="815" class="body">候选：bus 00–06</text><text x="1053" y="840" class="body">显式 _CRS / BAR / IRQ 合同</text><text x="1053" y="865" class="body">平台复位能力仅可信 Zone0</text><path d="M700 916V952" class="flow"/>
<rect x="40" y="962" width="1320" height="157" rx="16" fill="#e5f5ef" stroke="#81bca4"/>
<text x="60" y="998" class="head">③ 可信 Zone0 · Arch Linux 6.18 LTS</text>
<text x="60" y="1030" class="body">CPU 0–7 · 可用 RAM 实测约 31.2 GiB（扣除 hvisor / 固件保留）· 根盘 / 数据盘 / USB / 网络 / GPU / 音频</text>
<text x="60" y="1060" class="body">Linux 原生驱动 → systemd → Plasma Login / KDE Wayland；存储与应用服务继续运行在此管理域</text>
<text x="60" y="1090" class="tag">当前目标：19 项 PCI 功能都分配 / 呈现给 Zone0。仍经 hvisor 配置空间、内存与中断处理路径。</text>
<rect x="40" y="1151" width="1320" height="223" rx="16" fill="none" stroke="#8997ae" stroke-width="2" stroke-dasharray="8 6"/>
<text x="60" y="1187" class="head">④ 后续拆 Zone 的设计边界（虚线 = 规划，不是已实现的安全承诺）</text>
<text x="60" y="1222" class="body">建议候选：独占 GPU + HDMI ｜ 独占 ASMedia USB ｜ 独占 Wi-Fi；先保留根盘、管理网与平台管理组。</text>
<text x="60" y="1255" class="body">分配事务：校验依赖 → 解绑驱动 → 停 DMA / IRQ → 撤销旧映射与 IOTLB → 新 Zone 映射 → 驱动启动</text>
<text x="60" y="1288" class="body">必须同步改变：设备 owner、CPU / RAM、EPT、VT-d、MSI / INTx 路由、ACPI 可见性、桥窗口与复位权限。</text>
<text x="60" y="1321" class="body">单独改 BDF / owner 不足以实现隔离；还需核查 ACS / P2P、RMRR、共享复位域与 legacy I/O。</text>
<text x="60" y="1350" class="small">依据：board.rs · src/pci/pci_config.rs · x86_64/pci.rs · intel_vtd · DEVICE_OWNERSHIP.md；实机测试优先于仿真。</text>
</svg>
